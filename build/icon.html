<!doctype html>
<!-- The Starspite app icon, drawn the way the game's own art is (src/render/sprites.js):
     the player's white ring on a deep-space tile, a sharp four-point star bursting through
     it with a crimson Exalted glow. Open this file to preview it at every size;
     `npm run icon` renders it into build/icon.ico. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Starspite icon</title>
<style>
  body { margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 24px; font: 12px sans-serif; color: #999; background: #1b1b1b; }
  .row { display: flex; align-items: flex-end; gap: 20px; padding: 20px; border-radius: 8px; }
  .row.light { background: #f3f3f3; }
  .row.dark { background: #202020; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
</style>
</head>
<body>
<script>
const TAU = Math.PI * 2;
const SIZES = [256, 128, 64, 48, 32, 24, 16];

const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};
const radial = (ctx, x, y, r, stops, x0 = x, y0 = y) => {
  const g = ctx.createRadialGradient(x0, y0, 0, x, y, r);
  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  return g;
};
// Seeded, so every size scatters the same stars.
const seeded = (seed) => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

// Four-point star: arms `rx` across and `ry` tall, pinched to `k` at the waist.
function star(ctx, x, y, rx, ry, k) {
  ctx.beginPath();
  ctx.moveTo(x + rx, y);
  ctx.quadraticCurveTo(x + k, y + k, x, y + ry);
  ctx.quadraticCurveTo(x - k, y + k, x - rx, y);
  ctx.quadraticCurveTo(x - k, y - k, x, y - ry);
  ctx.quadraticCurveTo(x + k, y - k, x + rx, y);
}

function drawIcon(S) {
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.scale(S, S);
  const px = 1 / S;
  const small = S <= 32;

  // Tile: rounded square of deep space.
  const inset = small ? 0 : 0.03, radius = small ? 0.2 : 0.21;
  const tile = new Path2D();
  tile.roundRect(inset, inset, 1 - inset * 2, 1 - inset * 2, radius);
  ctx.save();
  ctx.clip(tile);
  ctx.fillStyle = radial(ctx, 0.5, 0.45, 0.8, ['#141436', '#070712', '#010103']);
  ctx.fillRect(0, 0, 1, 1);
  ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, r, color, a] of [[0.22, 0.82, 0.55, '#ca0000', 0.38], [0.85, 0.15, 0.5, '#5b3fd0', 0.3], [0.5, 0.5, 0.4, '#ca0000', 0.18]]) {
    ctx.fillStyle = radial(ctx, x, y, r, [rgba(color, a), rgba(color, a * 0.35), rgba(color, 0)]);
    ctx.fillRect(0, 0, 1, 1);
  }
  ctx.globalCompositeOperation = 'source-over';
  if (!small) {
    const rand = seeded(7);
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 46; i++) {
      const x = rand(), y = rand(), r = 0.0025 + 0.006 * rand() ** 3;
      if (Math.hypot(x - 0.5, y - 0.5) < 0.36) continue; // keep the emblem clean
      ctx.globalAlpha = 0.25 + 0.6 * rand();
      ctx.beginPath();
      ctx.arc(x, y, Math.max(r, 0.6 * px), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 0.8;
    for (const [x, y, r] of [[0.17, 0.2, 0.035], [0.84, 0.74, 0.028], [0.78, 0.3, 0.02]]) {
      ctx.fillStyle = '#ffffff';
      star(ctx, x, y, r, r, r * 0.14);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // The player's ring: black core with a hint of indigo, white rim with a cool glow.
  const R = 0.27, line = Math.max(0.05, 1.6 * px);
  ctx.beginPath();
  ctx.arc(0.5, 0.5, R, 0, TAU);
  ctx.fillStyle = radial(ctx, 0.5, 0.5, R, ['#1c1c48', '#06060f', '#000000'], 0.42, 0.4);
  ctx.fill();
  ctx.save();
  ctx.shadowColor = rgba('#c8d2ff', 0.9);
  ctx.shadowBlur = S * 0.05;
  ctx.lineWidth = line;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.restore();

  // Crimson heat inside the ring, then the star bursting through it.
  ctx.fillStyle = radial(ctx, 0.5, 0.5, R * 0.95, [rgba('#ff2a2a', 0.55), rgba('#ca0000', 0.25), rgba('#ca0000', 0)]);
  ctx.beginPath();
  ctx.arc(0.5, 0.5, R - line / 2, 0, TAU);
  ctx.fill();
  const rx = 0.17, ry = 0.44, k = small ? 0.03 : 0.018;
  ctx.save();
  ctx.shadowColor = rgba('#ff1a1a', 0.95);
  ctx.shadowBlur = S * 0.07;
  star(ctx, 0.5, 0.5, rx, ry, k);
  ctx.fillStyle = radial(ctx, 0.5, 0.5, ry, ['#ffffff', '#ffffff', '#ffd9d9']);
  ctx.fill();
  ctx.restore();
  star(ctx, 0.5, 0.5, rx, ry, k);
  ctx.fillStyle = radial(ctx, 0.5, 0.5, ry, ['#ffffff', '#ffffff', '#ffe3e3']);
  ctx.fill();

  ctx.restore();
  return c;
}

// Preview: every size the .ico carries, on light and dark taskbars.
for (const theme of ['dark', 'light']) {
  const row = document.createElement('div');
  row.className = `row ${theme}`;
  for (const s of SIZES) {
    const fig = document.createElement('figure');
    fig.append(drawIcon(s), Object.assign(document.createElement('span'), { textContent: s }));
    row.append(fig);
  }
  document.body.append(row);
}
</script>
</body>
</html>
